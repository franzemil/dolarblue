[project]
name = "dolarblue"
version = "0.1.0"
description = "Dólar blue Bolivia (BOB/USD): pipeline de datos, modelado y informe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "statsmodels>=0.14",
    "typer>=0.12",
    "openai>=1.30",
    "pymupdf>=1.24",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
]

[tool.uv]
package = false
